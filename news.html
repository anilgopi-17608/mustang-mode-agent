<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Daily Digest — Tech Pit Stop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; color: #fff; line-height: 1.7; overflow-x: hidden; background: #0a0014; min-height: 100vh; }
a { color: inherit; text-decoration: none; }

.mustang-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: url('BMW M5 Competition.jpg'); background-size: cover; background-position: center; background-attachment: fixed; z-index: -3; }
.bg-overlay { position: fixed; inset: 0; background: linear-gradient(135deg, rgba(10,0,20,0.75), rgba(20,5,20,0.7), rgba(40,10,30,0.75)); z-index: -2; }
.vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.5) 100%); z-index: -1; pointer-events: none; }
.racing-stripes { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, transparent, #ffd700 15%, #ff6b00 30%, #dc2626 50%, #ff6b00 70%, #ffd700 85%, transparent); z-index: 100; box-shadow: 0 0 20px rgba(255,107,0,0.6); }

nav { position: sticky; top: 0; background: rgba(10,0,20,0.92); backdrop-filter: blur(15px); border-bottom: 2px solid rgba(255,107,0,0.4); padding: 18px 0; z-index: 50; }
.nav-container { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-family: 'Audiowide', cursive; font-size: 22px; background: linear-gradient(90deg, #ffd700, #ff6b00, #dc2626); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 3px; }
.brand span { color: #fff; -webkit-text-fill-color: #fff; }

.back-link { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: rgba(255,107,0,0.15); border: 1px solid rgba(255,107,0,0.5); border-radius: 30px; color: #ffd700; font-size: 13px; font-weight: 600; transition: all 0.3s; }
.back-link:hover { background: linear-gradient(135deg, #ff6b00, #dc2626); border-color: #ffd700; color: #fff; transform: translateX(-5px); }

.page-header { max-width: 1000px; margin: 0 auto; padding: 60px 24px 40px; text-align: center; }
.page-header h1 { font-family: 'Audiowide', cursive; font-size: clamp(36px, 6vw, 56px); background: linear-gradient(90deg, #ffd700, #ff6b00, #dc2626); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; margin-bottom: 16px; }
.date-stamp { font-family: 'Audiowide', cursive; color: #ffd700; font-size: 14px; letter-spacing: 3px; margin-bottom: 12px; }
.last-update { color: #16a34a; font-size: 11px; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
.market-update { color: #fbbf24; font-size: 11px; letter-spacing: 1px; margin-bottom: 20px; font-weight: 600; animation: blink 2s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
.page-header p { color: #ddd; font-size: 16px; max-width: 600px; margin: 0 auto; line-height: 1.6; }

.sections-container { max-width: 1000px; margin: 0 auto 60px; padding: 0 24px; }

.section-card { background: rgba(15,5,25,0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,107,0,0.3); border-radius: 14px; margin-bottom: 16px; overflow: hidden; transition: all 0.3s; }
.section-card:hover { border-color: rgba(255,107,0,0.6); box-shadow: 0 8px 30px rgba(255,107,0,0.2); }

.section-toggle { width: 100%; background: transparent; border: none; padding: 22px 24px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: #fff; transition: all 0.3s; font-family: inherit; }
.section-toggle:hover { background: rgba(255,107,0,0.05); }

.section-toggle-left { display: flex; align-items: center; gap: 16px; }
.section-icon-circle { width: 48px; height: 48px; background: linear-gradient(135deg, #ffd700, #ff6b00, #dc2626); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(255,107,0,0.4); }
.section-info { text-align: left; }
.section-title { font-family: 'Audiowide', cursive; font-size: 16px; letter-spacing: 2px; color: #fff; margin-bottom: 4px; }
.section-count { color: #ffd700; font-size: 11px; letter-spacing: 2px; font-weight: 600; }

.arrow-icon { width: 36px; height: 36px; background: rgba(255,107,0,0.15); border: 1px solid rgba(255,107,0,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffd700; font-size: 16px; transition: all 0.3s; flex-shrink: 0; }
.section-card.open .arrow-icon { background: linear-gradient(135deg, #ffd700, #ff6b00); color: #fff; transform: rotate(90deg); }

.section-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
.section-card.open .section-content { max-height: 8000px; transition: max-height 0.6s ease-in; }
.section-inner { padding: 0 24px 24px; }

.market-subsection { margin-top: 20px; }
.market-subsection:first-child { margin-top: 0; }
.market-subtitle { color: #ffd700; font-family: 'Audiowide', cursive; font-size: 13px; letter-spacing: 2px; margin-bottom: 12px; }

.stock-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stock-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,107,0,0.2); border-radius: 10px; padding: 16px; transition: all 0.2s; }
.stock-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,107,0,0.5); }
.stock-name { color: #aaa; font-size: 11px; letter-spacing: 1px; font-weight: 600; margin-bottom: 6px; }
.stock-value { color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 4px; font-family: 'Audiowide', cursive; }
.stock-change { font-size: 12px; font-weight: bold; }
.stock-change.up { color: #16a34a; }
.stock-change.down { color: #dc2626; }

.news-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,107,0,0.2); border-radius: 10px; padding: 18px; margin-bottom: 12px; transition: all 0.2s; }
.news-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,107,0,0.5); transform: translateX(4px); }
.news-item .news-title { color: #fff; font-size: 15px; font-weight: bold; margin-bottom: 8px; line-height: 1.4; }
.news-item .news-summary { color: #bbb; font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
.news-item .news-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.news-item .news-source { color: #ff6b00; font-weight: bold; letter-spacing: 1px; }
.news-item .read-link { color: #16a34a; font-weight: 600; }

.loading-state { text-align: center; padding: 60px 20px; color: #aaa; }
.loading-state .spinner { font-size: 48px; animation: spin 2s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.empty-state { text-align: center; padding: 60px 20px; background: rgba(15,5,25,0.7); border-radius: 14px; }
.empty-state .icon { font-size: 64px; margin-bottom: 16px; }
.empty-state h2 { color: #ffd700; font-family: 'Audiowide', cursive; margin-bottom: 12px; letter-spacing: 2px; }
.empty-state p { color: #aaa; max-width: 400px; margin: 0 auto; line-height: 1.6; }

footer { text-align: center; padding: 40px 24px; border-top: 1px solid rgba(255,107,0,0.3); color: #aaa; font-size: 12px; background: rgba(10,0,20,0.7); backdrop-filter: blur(15px); }
footer .accent { background: linear-gradient(90deg, #ffd700, #ff6b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }

@media (max-width: 768px) {
    .page-header { padding: 40px 20px; }
    .section-toggle { padding: 18px 20px; }
    .section-inner { padding: 0 20px 20px; }
    .section-icon-circle { width: 40px; height: 40px; font-size: 20px; }
    .mustang-bg { background-attachment: scroll; }
}
</style>
</head>
<body>

<div class="mustang-bg"></div>
<div class="bg-overlay"></div>
<div class="vignette"></div>
<div class="racing-stripes"></div>

<nav>
    <div class="nav-container">
        <div class="brand">🏎️ MUSTANG <span>MODE</span></div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</nav>

<div class="page-header">
    <h1>🌍 DAILY DIGEST</h1>
    <div class="date-stamp" id="todayDate">LOADING...</div>
    <div class="last-update" id="lastUpdate"></div>
    <div class="market-update" id="marketUpdate"></div>
    <p>Your morning briefing — click any section to expand. Markets update hourly.</p>
</div>

<div class="sections-container" id="sectionsContainer">
    <div class="loading-state">
        <div class="spinner">⚙️</div>
        <p style="margin-top:16px;">Loading today's news...</p>
    </div>
</div>

<footer>
    <div><span class="accent">🌍 TECH PIT STOP</span> — your daily intel briefing</div>
    <div style="margin-top:8px;">News at 7 AM IST · Markets update hourly · Built by Anil Gopi Gudapati</div>
</footer>

<script>
const today = new Date();
const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
document.getElementById('todayDate').textContent = `${days[today.getDay()]} · ${months[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}`;

function toggleSection(sectionId) {
    const card = document.querySelector(`[data-section="${sectionId}"]`);
    if (card) card.classList.toggle('open');
}

async function loadNews() {
    try {
        const response = await fetch('news.json?t=' + Date.now());
        if (!response.ok) {
            showError("news.json not found. The agent hasn't run yet.");
            return;
        }
        const data = await response.json();
        renderNews(data);
    } catch (err) {
        console.error('Error loading news:', err);
        showError("Couldn't load news. " + err.message);
    }
}

function renderNews(data) {
    const container = document.getElementById('sectionsContainer');
    container.innerHTML = '';
    
    if (data.last_updated) {
        document.getElementById('lastUpdate').textContent = '🟢 NEWS UPDATED: ' + data.last_updated;
    }
    
    if (data.market_last_updated) {
        document.getElementById('marketUpdate').textContent = '📈 MARKETS UPDATED: ' + data.market_last_updated;
    }
    
    // Build market section (with new structure: Indian + US + Crypto)
    if (data.market) {
        container.appendChild(buildMarketSection(data.market));
    }
    
    if (data.categories) {
        let sectionIdx = 1;
        for (const [catName, catData] of Object.entries(data.categories)) {
            if (catData.items && catData.items.length > 0) {
                container.appendChild(buildNewsSection(catName, catData, sectionIdx));
                sectionIdx++;
            }
        }
    }
    
    if (container.children.length === 0) {
        showError("No news available yet. Check back after 7 AM IST tomorrow!");
    }
    
    // Auto-open first section
    setTimeout(() => {
        const firstSection = container.querySelector('.section-card');
        if (firstSection) firstSection.classList.add('open');
    }, 300);
}

function buildMarketSection(market) {
    const card = document.createElement('div');
    card.className = 'section-card';
    card.setAttribute('data-section', 'market');
    
    let innerHTML = '';
    
    // 🇮🇳 INDIAN MARKETS
    if (market.indian) {
        innerHTML += '<div class="market-subsection">';
        innerHTML += '<div class="market-subtitle">🇮🇳 INDIAN MARKETS — INDICES</div>';
        innerHTML += '<div class="stock-grid">';
        (market.indian.indices || []).forEach(s => innerHTML += buildStockCard(s));
        innerHTML += '</div>';
        
        if (market.indian.gainers && market.indian.gainers.length > 0) {
            innerHTML += '<div class="market-subtitle" style="margin-top:18px;color:#16a34a;">🏆 INDIAN GAINERS</div>';
            innerHTML += '<div class="stock-grid">';
            market.indian.gainers.forEach(s => innerHTML += buildStockCard(s));
            innerHTML += '</div>';
        }
        
        if (market.indian.losers && market.indian.losers.length > 0) {
            innerHTML += '<div class="market-subtitle" style="margin-top:18px;color:#dc2626;">📉 INDIAN LOSERS</div>';
            innerHTML += '<div class="stock-grid">';
            market.indian.losers.forEach(s => innerHTML += buildStockCard(s));
            innerHTML += '</div>';
        }
        innerHTML += '</div>';
    }
    
    // 🇺🇸 US MARKETS
    if (market.us) {
        innerHTML += '<div class="market-subsection">';
        innerHTML += '<div class="market-subtitle">🇺🇸 US MARKETS — INDICES</div>';
        innerHTML += '<div class="stock-grid">';
        (market.us.indices || []).forEach(s => innerHTML += buildStockCard(s));
        innerHTML += '</div>';
        
        if (market.us.gainers && market.us.gainers.length > 0) {
            innerHTML += '<div class="market-subtitle" style="margin-top:18px;">📊 TOP US STOCKS</div>';
            innerHTML += '<div class="stock-grid">';
            [...market.us.gainers, ...market.us.losers].forEach(s => innerHTML += buildStockCard(s));
            innerHTML += '</div>';
        }
        innerHTML += '</div>';
    }
    
    // ₿ CRYPTO
    if (market.crypto && market.crypto.length > 0) {
        innerHTML += '<div class="market-subsection">';
        innerHTML += '<div class="market-subtitle">₿ CRYPTOCURRENCY</div>';
        innerHTML += '<div class="stock-grid">';
        market.crypto.forEach(s => innerHTML += buildStockCard(s, '$'));
        innerHTML += '</div>';
        innerHTML += '</div>';
    }
    
    // 💵 CURRENCY & COMMODITY
    if ((market.currency && market.currency.length > 0) || (market.commodity && market.commodity.length > 0)) {
        innerHTML += '<div class="market-subsection">';
        innerHTML += '<div class="market-subtitle">💵 FOREX & COMMODITY</div>';
        innerHTML += '<div class="stock-grid">';
        (market.currency || []).forEach(s => innerHTML += buildStockCard(s));
        (market.commodity || []).forEach(s => innerHTML += buildStockCard(s));
        innerHTML += '</div>';
        innerHTML += '</div>';
    }
    
    // Total count
    const totalCount = ((market.indian?.indices?.length || 0) + 
                       (market.indian?.gainers?.length || 0) + 
                       (market.indian?.losers?.length || 0) + 
                       (market.us?.indices?.length || 0) +
                       (market.us?.gainers?.length || 0) +
                       (market.crypto?.length || 0) +
                       (market.currency?.length || 0) +
                       (market.commodity?.length || 0));
    
    card.innerHTML = `
        <button class="section-toggle" onclick="toggleSection('market')">
            <div class="section-toggle-left">
                <div class="section-icon-circle">📈</div>
                <div class="section-info">
                    <div class="section-title">MARKET SNAPSHOT</div>
                    <div class="section-count">${totalCount} INDICATORS · UPDATES HOURLY</div>
                </div>
            </div>
            <div class="arrow-icon">→</div>
        </button>
        <div class="section-content">
            <div class="section-inner">${innerHTML}</div>
        </div>
    `;
    return card;
}

function buildStockCard(stock, prefix = '') {
    const arrow = stock.is_up ? '▲' : '▼';
    const cls = stock.is_up ? 'up' : 'down';
    const sign = stock.is_up ? '+' : '';
    const price = (stock.price || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    const pct = (stock.change_pct || 0).toFixed(2);
    return `
        <div class="stock-card">
            <div class="stock-name">${stock.name || 'Unknown'}</div>
            <div class="stock-value">${prefix}${price}</div>
            <div class="stock-change ${cls}">${arrow} ${sign}${pct}%</div>
        </div>
    `;
}

function buildNewsSection(catName, catData, idx) {
    const sectionId = 'cat-' + idx;
    const items = catData.items || [];
    const icon = catName.match(/^\S+/) ? catName.match(/^\S+/)[0] : '📰';
    const cleanName = catName.replace(/^\S+\s+/, '');
    
    let itemsHtml = '';
    items.forEach(item => {
        const sourceLabel = item.source || 'News';
        const link = item.link || '#';
        itemsHtml += `
            <div class="news-item">
                <div class="news-title">${escapeHtml(item.title || 'Untitled')}</div>
                <div class="news-summary">💡 ${escapeHtml(item.summary || '')}</div>
                <div class="news-meta">
                    <span class="news-source">${escapeHtml(sourceLabel)}</span>
                    <a href="${escapeHtml(link)}" target="_blank" class="read-link">Read full →</a>
                </div>
            </div>
        `;
    });
    
    const card = document.createElement('div');
    card.className = 'section-card';
    card.setAttribute('data-section', sectionId);
    card.innerHTML = `
        <button class="section-toggle" onclick="toggleSection('${sectionId}')">
            <div class="section-toggle-left">
                <div class="section-icon-circle">${icon}</div>
                <div class="section-info">
                    <div class="section-title">${escapeHtml(cleanName)}</div>
                    <div class="section-count">${items.length} ${items.length === 1 ? 'STORY' : 'STORIES'}</div>
                </div>
            </div>
            <div class="arrow-icon">→</div>
        </button>
        <div class="section-content">
            <div class="section-inner">${itemsHtml}</div>
        </div>
    `;
    return card;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showError(message) {
    const container = document.getElementById('sectionsContainer');
    container.innerHTML = `
        <div class="empty-state">
            <div class="icon">🏁</div>
            <h2>NEWS NOT AVAILABLE YET</h2>
            <p>${escapeHtml(message)}</p>
            <p style="margin-top:16px; color:#ffd700;">The agent runs daily at 7:00 AM IST. Markets update hourly. Once they run, this page will show fresh data automatically!</p>
        </div>
    `;
}

// Load on page load
loadNews();

// Auto-refresh every 5 minutes to get latest market data
setInterval(loadNews, 5 * 60 * 1000);
</script>

</body>
</html>
