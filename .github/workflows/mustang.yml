name: Mustang Mode Daily Agent

on:
  workflow_dispatch:

  schedule:
    - cron: '30 2 * * *'    # 8:00 AM IST
    - cron: '30 4 * * *'    # 10:00 AM IST
    - cron: '30 6 * * *'    # 12:00 PM IST
    - cron: '30 13 * * *'   # 7:00 PM IST

permissions:
  contents: write

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mustang Mode Daily Agent
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: 'Asia/Kolkata'
        run: python daily_agent.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "📊 Update stats from automated run"
          git push
        continue-on-error: true
